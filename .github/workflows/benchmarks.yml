name: Performance Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  benchmark:
    name: Throughput & Memory Regression Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Package & Benchmark Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Throughput Benchmark Harness
        run: |
          python tests/benchmarks/bench_validator.py --rows 1000 10000 50000 --iterations 2 --output reports/benchmark_telemetry.json

      - name: Run Memory Allocation Benchmark
        run: |
          python tests/benchmarks/bench_memory.py --rows 1000 10000

      - name: Upload Benchmark Telemetry Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-telemetry
          path: reports/benchmark_telemetry.json
