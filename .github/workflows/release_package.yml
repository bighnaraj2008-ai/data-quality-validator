name: Release Package

on:
  push:
    tags: ["v*"]

jobs:
  build-and-release:
    name: Build, Test & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine wheel pytest pytest-cov sqlfluff flake8 black

      - name: Pre-release Gate (Lint + Test)
        run: |
          flake8 src tests scripts --count --max-line-length=120 --statistics
          black --check src tests scripts
          sqlfluff lint sql/checks/ --dialect ansi
          pytest tests/ -q

      - name: Build Wheel and SDist
        run: |
          python -m build --outdir dist .

      - name: Build Validation Bundle
        run: |
          rm -rf bundle && mkdir -p bundle/sql_checks
          cp -r sql/checks/. bundle/sql_checks/
          cp README.md bundle/
          cp LICENSE bundle/
          pytest tests/ -q --junitxml=bundle/test-report.xml || true
          zip -r validation-bundle.zip bundle

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/

      - name: Upload Validation Bundle
        uses: actions/upload-artifact@v7
        with:
          name: validation-bundle
          path: validation-bundle.zip

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$TWINE_PASSWORD" ]; then
            python -m twine upload --skip-existing dist/*
          else
            echo "PYPI_API_TOKEN not set; skipping PyPI upload"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
            validation-bundle.zip
          generate_release_notes: true
