name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install flake8 black sqlfluff pytest pytest-cov

      - name: Lint Python with Flake8
        run: |
          flake8 src tests scripts --count --max-line-length=120 --statistics

      - name: Check Python Formatting with Black
        run: |
          black --check src tests scripts

      - name: Lint SQL Check Templates with SQLFluff
        run: |
          sqlfluff lint sql/checks/ --dialect ansi

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --junitxml=test-results-${{ matrix.python-version }}.xml --cov=validator --cov-report=xml

      - name: Verify Benchmark Smoke Execution
        run: |
          python tests/benchmarks/bench_validator.py --rows 1000 --iterations 1 --no-asserts

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
