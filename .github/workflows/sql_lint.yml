name: SQL Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  sql-lint:
    name: Lint SQL Check Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install SQLFluff
        run: |
          python -m pip install --upgrade pip
          pip install sqlfluff

      - name: Lint SQL Check Templates (ANSI Dialect)
        run: |
          sqlfluff lint sql/checks/ --dialect ansi --processes 2

      - name: Verify SQL Template Warehouse Smoke Execution
        run: |
          python scripts/validate_warehouse.py
