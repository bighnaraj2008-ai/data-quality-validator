name: Data Quality Validator CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml flake8 sqlfluff
          pip install -e .

      - name: Lint Code with Flake8
        run: |
          flake8 src tests scripts --count --max-line-length=120 --statistics

      - name: Lint SQL Check Templates
        run: |
          sqlfluff lint sql/checks/ --dialect ansi

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --junitxml=test-results.xml

      - name: Run Smoke Test Script
        run: |
          chmod +x scripts/smoke_test.sh
          bash scripts/smoke_test.sh
