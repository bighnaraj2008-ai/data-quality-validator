[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-validator"
version = "1.0.0"
description = "A modular data quality validation engine with SQL checks and schema drift detection"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "bighnaraj2008-ai", email = "236182883+bighnaraj2008-ai@users.noreply.github.com"}
]
dependencies = [
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "SQLAlchemy>=2.0.0",
    "click>=8.1.0",
    "tabulate>=0.9.0",
    "pyyaml>=6.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "sqlfluff>=3.0.0",
    "numpy>=1.24.0",
]
lint = [
    "flake8>=7.0.0",
    "black>=24.0.0",
    "sqlfluff>=3.0.0",
]
all = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "flake8>=7.0.0",
    "black>=24.0.0",
    "sqlfluff>=3.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
validator = "validator.core:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.venv
  | venv
  | \.svn
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.flake8]
max-line-length = 120
extend-ignore = "E203, W503"
exclude = "venv,.venv,__pycache__,.pytest_cache,build,dist,.git,.eggs"
per-file-ignores = "tests/*: E501"

[tool.coverage.run]
source = ["src/validator", "src/config"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
