[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-validator"
version = "0.1.0"
description = "A modular data quality validation engine with SQL checks and schema drift detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "bighnaraj2008-ai", email = "236182883+bighnaraj2008-ai@users.noreply.github.com"}
]
dependencies = [
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "SQLAlchemy>=2.0.0",
    "click>=8.1.0",
    "tabulate>=0.9.0",
    "pyyaml>=6.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "sqlfluff>=3.0.0"
]

[project.scripts]
validator = "validator.core:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --strict-markers"
